<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simpsons Trivia Chat</title>
  <style>
    :root {
      --sky: #4fc3f7;
      --sky-dark: #0f7fb8;
      --yellow: #fed41d;
      --yellow-dark: #e0b200;
      --pink: #f7a8c8;
      --brown: #3d2b1f;
      --cream: #fff8e1;
      --white: #ffffff;
      --red: #d64541;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--sky);
      color: var(--brown);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    header {
      background: var(--yellow);
      border-bottom: 4px solid var(--brown);
      padding: 14px 16px;
    }

    h1 {
      margin: 0;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 1.6rem;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 var(--white);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      height: calc(100vh - 80px);
      min-height: 480px;
    }

    .panel {
      background: var(--cream);
      border: 4px solid var(--brown);
      border-radius: 16px;
      box-shadow: 6px 6px 0 var(--brown);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel-title {
      margin: 0;
      padding: 12px 16px;
      background: var(--pink);
      border-bottom: 4px solid var(--brown);
      border-radius: 12px 12px 0 0;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    /* ---------- Chat ---------- */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border: 3px solid var(--brown);
      border-radius: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.45;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--yellow);
      border-bottom-right-radius: 4px;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--white);
      border-bottom-left-radius: 4px;
    }

    .bubble.pending { font-style: italic; color: var(--sky-dark); }
    .bubble.error { background: #ffd6d3; color: var(--red); }

    .bubble .who {
      display: block;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      opacity: 0.75;
    }

    .empty {
      margin: auto;
      text-align: center;
      max-width: 420px;
      color: var(--brown);
    }

    .empty strong { font-family: Impact, "Arial Black", sans-serif; font-size: 1.3rem; }

    form.ask {
      display: flex;
      gap: 10px;
      padding: 12px;
      border-top: 4px solid var(--brown);
      background: var(--white);
      border-radius: 0 0 12px 12px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font: inherit;
      color: var(--brown);
      background: var(--cream);
      border: 3px solid var(--brown);
      border-radius: 24px;
      outline: none;
    }

    input[type="text"]:focus { box-shadow: 0 0 0 3px var(--sky); }

    button {
      font: inherit;
      cursor: pointer;
      color: var(--brown);
      border: 3px solid var(--brown);
      border-radius: 24px;
      padding: 10px 18px;
      background: var(--yellow);
      font-weight: bold;
      box-shadow: 3px 3px 0 var(--brown);
    }

    button:hover:not(:disabled) { background: var(--yellow-dark); }
    button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--brown); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ---------- History sidebar ---------- */
    .history {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history li button {
      width: 100%;
      text-align: left;
      background: var(--white);
      box-shadow: 2px 2px 0 var(--brown);
      border-radius: 12px;
      padding: 10px 12px;
      display: block;
    }

    .history li button:hover:not(:disabled) { background: var(--cream); }

    .history li button.active {
      background: var(--sky);
      color: var(--white);
      text-shadow: 1px 1px 0 var(--brown);
    }

    .history .q {
      display: block;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history .date {
      display: block;
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 2px;
    }

    .history-empty {
      padding: 12px;
      text-align: center;
      opacity: 0.7;
    }

    .panel-footer {
      padding: 10px;
      border-top: 4px solid var(--brown);
      border-radius: 0 0 12px 12px;
      background: var(--white);
    }

    .clear-btn {
      width: 100%;
      background: var(--red);
      color: var(--white);
      text-shadow: 1px 1px 0 var(--brown);
    }

    .clear-btn:hover:not(:disabled) { background: #b53330; }

    /* ---------- Small screens ---------- */
    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 0;
        padding: 16px;
      }
      .messages { min-height: 60vh; }
      .history { max-height: 40vh; }
      .bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Simpsons Trivia Chat</h1>
  </header>

  <div class="layout">
    <section class="panel" aria-label="Chat">
      <h2 class="panel-title">Ask the Simpsons Expert</h2>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form class="ask" id="ask-form" autocomplete="off">
        <input type="text" id="question" placeholder="Who voices Mr. Burns?" maxlength="500" autocomplete="off" required>
        <button type="submit" id="send-btn">Ask D'oh!</button>
      </form>
    </section>

    <aside class="panel" aria-label="Past questions">
      <h2 class="panel-title">Past Questions</h2>
      <ul class="history" id="history"></ul>
      <div class="panel-footer">
        <button type="button" class="clear-btn" id="clear-btn">Clear history</button>
      </div>
    </aside>
  </div>

  <script>
    (() => {
      const API_URL = "/trivia";
      const HISTORY_KEY = "simpsons-trivia-history";
      const ACTIVE_KEY = "simpsons-trivia-active";
      const WELCOME = "Hi! Ask me anything about The Simpsons and I'll answer with trivia.";

      const els = {
        messages: document.getElementById("messages"),
        history: document.getElementById("history"),
        form: document.getElementById("ask-form"),
        input: document.getElementById("question"),
        send: document.getElementById("send-btn"),
        clear: document.getElementById("clear-btn"),
      };

      // ----- state -----
      let history = [];   // [{id, question, answer, createdAt}], newest first
      let thread = [];    // entries currently shown in the chat panel
      let pending = null; // question currently waiting for an answer

      // ----- local storage (every access guarded: storage may be blocked) -----
      function readStorage(key, fallback) {
        try {
          const parsed = JSON.parse(localStorage.getItem(key));
          return parsed ?? fallback;
        } catch (_) {
          return fallback;
        }
      }

      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (_) {
          /* storage unavailable or full: the page keeps working in memory */
        }
      }

      function loadState() {
        const saved = readStorage(HISTORY_KEY, []);
        history = Array.isArray(saved) ? saved.filter(isValidEntry) : [];
        const activeIds = readStorage(ACTIVE_KEY, []);
        thread = (Array.isArray(activeIds) ? activeIds : [])
          .map(id => history.find(e => e.id === id))
          .filter(Boolean);
      }

      function isValidEntry(e) {
        return e && typeof e.id === "string" && typeof e.question === "string" && typeof e.answer === "string";
      }

      function saveHistory() {
        writeStorage(HISTORY_KEY, history);
      }

      function saveActive() {
        writeStorage(ACTIVE_KEY, thread.map(e => e.id));
      }

      // ----- rendering -----
      function makeBubble(role, text, extraClass) {
        const div = document.createElement("div");
        div.className = `bubble ${role}` + (extraClass ? ` ${extraClass}` : "");
        const who = document.createElement("span");
        who.className = "who";
        who.textContent = role === "user" ? "You" : "Simpsons Expert";
        div.appendChild(who);
        div.appendChild(document.createTextNode(text));
        return div;
      }

      function renderChat() {
        els.messages.textContent = "";

        if (!thread.length && !pending) {
          const empty = document.createElement("div");
          empty.className = "empty";
          const strong = document.createElement("strong");
          strong.textContent = "Welcome to Springfield!";
          empty.appendChild(strong);
          empty.appendChild(document.createElement("br"));
          empty.appendChild(document.createTextNode(WELCOME));
          els.messages.appendChild(empty);
          return;
        }

        thread.forEach(entry => {
          els.messages.appendChild(makeBubble("user", entry.question));
          els.messages.appendChild(makeBubble("bot", entry.answer, entry.error ? "error" : ""));
        });

        if (pending) {
          els.messages.appendChild(makeBubble("user", pending));
          els.messages.appendChild(makeBubble("bot", "Thinking... (Mmm, donuts...)", "pending"));
        }

        els.messages.scrollTop = els.messages.scrollHeight;
      }

      function renderHistory() {
        els.history.textContent = "";

        if (!history.length) {
          const empty = document.createElement("li");
          empty.className = "history-empty";
          empty.textContent = "No questions yet.";
          els.history.appendChild(empty);
          return;
        }

        const activeIds = new Set(thread.map(e => e.id));

        history.forEach(entry => {
          const li = document.createElement("li");
          const btn = document.createElement("button");
          btn.type = "button";
          btn.title = entry.question;
          if (activeIds.has(entry.id)) btn.classList.add("active");

          const q = document.createElement("span");
          q.className = "q";
          q.textContent = entry.question;

          const date = document.createElement("span");
          date.className = "date";
          date.textContent = formatDate(entry.createdAt);

          btn.append(q, date);
          btn.addEventListener("click", () => showEntry(entry.id));
          li.appendChild(btn);
          els.history.appendChild(li);
        });
      }

      function formatDate(iso) {
        const d = new Date(iso);
        return isNaN(d) ? "" : d.toLocaleString();
      }

      function render() {
        renderChat();
        renderHistory();
      }

      // ----- actions -----
      function showEntry(id) {
        const entry = history.find(e => e.id === id);
        if (!entry) return;
        thread = [entry];
        saveActive();
        render();
      }

      function newId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      async function fetchAnswer(question) {
        const response = await fetch(`${API_URL}?${new URLSearchParams({ prompt: question })}`);
        if (!response.ok) throw new Error(`Server responded with ${response.status}`);
        return response.text();
      }

      async function handleSubmit(event) {
        event.preventDefault();
        const question = els.input.value.trim();
        if (!question || pending) return;

        pending = question;
        els.input.value = "";
        els.input.disabled = true;
        els.send.disabled = true;
        render();

        try {
          const answer = await fetchAnswer(question);
          const entry = { id: newId(), question, answer, createdAt: new Date().toISOString() };
          history.unshift(entry);
          thread = [...thread, entry];
          saveHistory();
          saveActive();
        } catch (err) {
          // Errors are shown in the chat but not saved to history.
          thread = [...thread, { id: "error", question, answer: `Doh! Something went wrong: ${err.message}`, error: true }];
        } finally {
          pending = null;
          els.input.disabled = false;
          els.send.disabled = false;
          els.input.focus();
          render();
        }
      }

      function clearHistory() {
        if (!history.length) return;
        if (!confirm("Delete all saved questions and answers?")) return;
        history = [];
        thread = [];
        saveHistory();
        saveActive();
        render();
      }

      // ----- init -----
      els.form.addEventListener("submit", handleSubmit);
      els.clear.addEventListener("click", clearHistory);
      loadState();
      render();
    })();
  </script>
</body>
</html>
